name: BookMyShow Booking Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookmyshow-booking-monitor
  cancel-in-progress: false

jobs:
  check-bookings:
    runs-on: ubuntu-latest
    name: Check Bookings
    timeout-minutes: 10

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      MOVIE_URL: ${{ secrets.MOVIE_URL }}
      DEBUG: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chrome

      - name: Restore notification state
        id: restore-state
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: booking-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            booking-state-

      - name: Initialize notification state
        run: test -f state.json || printf '{"sentNotifications":[]}\n' > state.json

      - name: Check BookMyShow for bookings
        run: npm start

      - name: Save notification state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: booking-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-${{ github.run_id }}
          path: |
            screenshots/
            html-snapshots/
          if-no-files-found: ignore
          retention-days: 7
